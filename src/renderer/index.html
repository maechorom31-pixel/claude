<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <title>작은 정령들</title>
  <link rel="stylesheet" href="./styles/main.css"/>
  <link rel="stylesheet" href="./styles/watercolor.css"/>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <filter id="watercolor" x="-10%" y="-10%" width="120%" height="120%">
        <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="3" result="noise"/>
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.6"/>
        <feGaussianBlur stdDeviation="0.35"/>
      </filter>
      <filter id="watercolor-soft" x="-10%" y="-10%" width="120%" height="120%">
        <feTurbulence type="fractalNoise" baseFrequency="0.55" numOctaves="3" seed="7" result="noise"/>
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.9"/>
        <feGaussianBlur stdDeviation="0.55"/>
      </filter>
      <filter id="paper-grain">
        <feTurbulence type="fractalNoise" baseFrequency="1.6" numOctaves="2" seed="13" result="grain"/>
        <feColorMatrix in="grain" values="0 0 0 0 0.42  0 0 0 0 0.28  0 0 0 0 0.16  0 0 0 0.18 0" result="tinted"/>
        <feComposite in="tinted" in2="SourceGraphic" operator="in"/>
        <feComposite in="SourceGraphic" in2="grain" operator="over"/>
      </filter>
    </defs>
  </svg>
  <div id="app">
    <div id="pet-stage"></div>
    <div id="hint"></div>
    <div id="card-slot"></div>
    <div id="panel-slot"></div>
    <div id="tray">
      <button id="open-collection" class="tray-btn" title="컬렉션">❉</button>
      <button id="open-settings" class="tray-btn" title="설정">⚙</button>
      <button id="hide-window" class="tray-btn" title="잠시 숨기기">−</button>
      <button id="quit" class="tray-btn" title="닫기">×</button>
    </div>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
